<!DOCTYPE html> <!-- HTML5 文档类型声明，告诉浏览器这是一个 HTML5 文档 -->
<html lang="en"> <!-- HTML 根元素，lang 属性指定页面语言为英语 -->

<head> <!-- 头部区域开始，包含页面的元数据 -->
    <meta charset="UTF-8"> <!-- 元数据，指定页面字符编码为 UTF-8，支持多语言 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 元数据，设置视口以适应移动设备屏幕 -->
    <title>新闻 - 北宇治高中吹奏部官网</title> <!-- 页面标题，显示在浏览器标签栏 -->
    <link rel="stylesheet" href="styles.css">
</head> <!-- 头部区域结束 -->

<body> <!-- 主体区域开始，包含页面的可见内容 -->
    <div id="header-container"></div>
    <!-- 主体内容区域 -->
    <div class="main">
        <h2>新闻资讯</h2>

        <!-- 新闻列表 -->
        <div class="news-list">
            <!-- 新闻项 1 -->
            <div class="news-item">
                <h3>2026年全国大赛预选赛晋级！</h3>
                <p class="news-date">2026-02-20</p>
                <p>恭喜北宇治高中吹奏部在京都府预选赛中表现优异，成功晋级全国大赛！全体成员将继续努力，为全国大赛做最后的准备。</p>
                <hr>
            </div>

            <!-- 新闻项 2 -->
            <div class="news-item">
                <h3>新成员欢迎会顺利举行</h3>
                <p class="news-date">2026-02-15</p>
                <p>2026年度春季学期新成员欢迎会于上周举行，共有20名新生加入我们的大家庭。部长Kumiko为新成员们介绍了吹奏部的历史和传统。</p>
                <hr>
            </div>

            <!-- 新闻项 3 -->
            <div class="news-item">
                <h3>新年音乐会圆满成功</h3>
                <p class="news-date">2026-01-10</p>
                <p>北宇治高中吹奏部2026新年音乐会在学校大礼堂举行，演奏了多首经典曲目，获得了师生和家长的一致好评。</p>
            </div>
        </div>
    </div>
    <!-- 底部区域 -->
    <div class="footer">
        <p>© 2026 版权信息</p>
    </div>

    <style>
        .news-list {
            text-align: left;
        }

        .news-item {
            margin-bottom: 20px;
        }

        .news-item h3 {
            color: #2b21e7;
            margin-bottom: 5px;
        }

        .news-date {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .news-item p {
            line-height: 1.6;
        }
    </style>
    <script src="header.js"></script>
</body> <!-- 主体区域结束 -->

</html> <!-- HTML 根元素结束 -->
