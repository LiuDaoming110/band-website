<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title>
</head>

<body>
    <header>
        <h1>欢迎来到我的网页</h1>
        <nav>
            <ul>
                <li><a href="#home">首页</a></li>
                <li><a href="#about">关于我</a></li>
                <li><a href="#contact">联系我</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>首页内容</h2>
            <p>这是一个<span>示例</span>段落，展示文本标签的使用。</p>
            <img src="https://via.placeholder.com/200" alt="示例图片">
        </section>

        <section id="about">
            <h2>关于我</h2>
            <ol>
                <li>兴趣：编程</li>
                <li>技能：HTML、CSS</li>
            </ol>
        </section>

        <section id="contact">
            <h2>联系我</h2>
            <form action="/submit" method="post">
                <label>姓名：<input type="text" placeholder="请输入姓名"></label><br>
                <label>邮箱：<input type="email" placeholder="请输入邮箱"></label><br>
                <button type="submit">提交</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 我的网页</p>
    </footer>
</body>

</html>
